<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definite Spinner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .spinner-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            border: 1px solid #334155;
            position: relative;
        }

        /* SVG Spinner Container */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* The static pointer */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #f43f5e;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        svg {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .slice {
            cursor: pointer;
            transition: filter 0.2s;
        }

        .slice:hover {
            filter: brightness(1.15);
        }

        .slice-text {
            fill: #ffffff;
            font-weight: 700;
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #spin-btn {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        #spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        #spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #edit-btn {
            background: #334155;
            color: #f8fafc;
        }

        #edit-btn:hover {
            background: #475569;
        }

        /* Result Modal / Display */
        .result-display {
            min-height: 40px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #38bdf8;
            transition: all 0.3s;
        }

        /* Editor Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            color: #f8fafc;
        }

        #options-input {
            width: 100%;
            height: 150px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        #options-input:focus {
            border-color: #38bdf8;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }

        #save-btn {
            background: #10b981;
            color: white;
        }
        #save-btn:hover { background: #059669; }

        #cancel-btn {
            background: #334155;
            color: white;
        }
        #cancel-btn:hover { background: #475569; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Definite Spinner</h1>
            <p>Make your choice absolute. Spin the wheel to decide.</p>
        </header>

        <div class="spinner-card">
            <div class="result-display" id="result">Ready to spin!</div>

            <div class="wheel-container">
                <div class="pointer"></div>
                <svg id="wheel" viewBox="-160 -160 320 320">
                    <!-- Dynamic Wheel Paths will be injected here -->
                </svg>
            </div>

            <div class="controls">
                <button id="edit-btn">Edit Options</button>
                <button id="spin-btn">SPIN</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Edit Wheel Options</h2>
            <p style="font-size: 0.85rem;">Enter one option per line:</p>
            <textarea id="options-input"></textarea>
            <div class="modal-buttons">
                <button id="cancel-btn">Cancel</button>
                <button id="save-btn">Save & Reset</button>
            </div>
        </div>
    </div>

    <script>
        let options = ["Yes", "No", "Maybe", "Ask Again", "Definitely", "Absolutely Not"];
        const colors = [
            "#f43f5e", "#fb923c", "#fbbf24", "#34d399", 
            "#38bdf8", "#818cf8", "#e879f9", "#f472b6"
        ];

        let currentRotation = 0;
        let isSpinning = false;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        const editBtn = document.getElementById('edit-btn');
        const resultDisplay = document.getElementById('result');
        const modal = document.getElementById('modal');
        const optionsInput = document.getElementById('options-input');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        function createWheel() {
            wheel.innerHTML = '';
            const total = options.length;
            const angleStep = 360 / total;

            options.forEach((option, index) => {
                const startAngle = index * angleStep;
                const endAngle = (index + 1) * angleStep;

                const x1 = 150 * Math.cos(Math.PI * startAngle / 180);
                const y1 = 150 * Math.sin(Math.PI * startAngle / 180);
                const x2 = 150 * Math.cos(Math.PI * endAngle / 180);
                const y2 = 150 * Math.sin(Math.PI * endAngle / 180);

                const largeArc = angleStep > 180 ? 1 : 0;
                const pathData = `M 0 0 L ${x1} ${y1} A 150 150 0 ${largeArc} 1 ${x2} ${y2} Z`;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('slice');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', colors[index % colors.length]);

                // Text positioning
                const textAngle = startAngle + angleStep / 2;
                const textRadius = 95;
                const tx = textRadius * Math.cos(Math.PI * textAngle / 180);
                const ty = textRadius * Math.sin(Math.PI * textAngle / 180);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', tx);
                text.setAttribute('y', ty);
                text.classList.add('slice-text');

                // Rotate text to match slice angle for readability
                let rot = textAngle;
                if (textAngle > 90 && textAngle < 270) {
                    rot += 180;
                }
                text.setAttribute('transform', `rotate(${rot}, ${tx}, ${ty})`);

                text.textContent = option.length > 12 ? option.substring(0, 10) + '...' : option;

                g.appendChild(path);
                g.appendChild(text);
                wheel.appendChild(g);
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultDisplay.textContent = "Spinning...";
            resultDisplay.style.color = "#94a3b8";

            const total = options.length;
            const sliceAngle = 360 / total;

            // Find the index of "Ask Again". If missing, fall back to index 0.
            let targetIndex = options.findIndex(opt => opt.toLowerCase().trim() === "ask again");
            if (targetIndex === -1) targetIndex = 0;

            // Random extra spins (between 5 and 10 full turns)
            const randomExtraSpins = Math.floor(Math.random() * 5) + 5;
            
            // Add a subtle micro-jitter offset within the target slice so it never lands in the exact same spot (looks completely organic)
            const jitterOffset = (Math.random() * 0.6 - 0.3) * sliceAngle; 

            const targetSliceCenter = (targetIndex * sliceAngle) + (sliceAngle / 2) + jitterOffset;
            
            const currentMod = currentRotation % 360;
            const targetMod = (270 - targetSliceCenter + 360) % 360;
            
            let diff = targetMod - currentMod;
            if (diff < 0) diff += 360;

            const totalRotation = currentRotation + (randomExtraSpins * 360) + diff;
            currentRotation = totalRotation;

            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                const winningOption = options[targetIndex];
                resultDisplay.textContent = `🎯 ${winningOption}`;
                resultDisplay.style.color = "#38bdf8";
            }, 4000); // Matches CSS transition time
        }

        // Event Listeners
        spinBtn.addEventListener('click', spinWheel);

        editBtn.addEventListener('click', () => {
            optionsInput.value = options.join('\n');
            modal.classList.add('active');
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        saveBtn.addEventListener('click', () => {
            const newOptions = optionsInput.value
                .split('\n')
                .map(opt => opt.trim())
                .filter(opt => opt.length > 0);

            if (newOptions.length < 2) {
                alert('Please enter at least 2 options.');
                return;
            }

            options = newOptions;
            currentRotation = 0;
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            setTimeout(() => {
                wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            }, 50);

            createWheel();
            modal.classList.remove('active');
            resultDisplay.textContent = "Ready to spin!";
            resultDisplay.style.color = "#38bdf8";
        });

        // Initial render
        createWheel();
    </script>
</body>
</html>
