<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle Orb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030305;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .btn.active {
            background: #fff;
            color: #030305;
            border-color: #fff;
            font-weight: 600;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0.7;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-container {
                bottom: 15px;
                padding: 8px 15px;
                gap: 8px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="instructions">Click & Drag to Rotate • Scroll to Zoom</div>

    <div class="ui-container">
        <button class="btn active" data-mode="orb">Orb</button>
        <button class="btn" data-mode="saturn">Saturn</button>
        <button class="btn" data-mode="dna">DNA Helix</button>
        <button class="btn" data-mode="galaxy">Galaxy</button>
        <button class="btn" id="colorBtn">Shift Color</button>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 100;
        controls.minDistance = 10;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Particle System Variables
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        // Color palettes
        const palettes = [
            { c1: new THREE.Color('#4facfe'), c2: new THREE.Color('#00f2fe') }, // Blue cyan
            { c1: new THREE.Color('#ff0844'), c2: new THREE.Color('#ffb199') }, // Fire
            { c1: new THREE.Color('#f77062'), c2: new THREE.Color('#fe5196') }, // Pink sunset
            { c1: new THREE.Color('#0fd850'), c2: new THREE.Color('#f9f047') }, // Matrix lime/yellow
            { c1: new THREE.Color('#b224ef'), c2: new THREE.Color('#7579ff') }  // Purple neon
        ];
        let currentPaletteIndex = 0;

        // Initialize base random positions
        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
            targetPositions[i] = positions[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Create glowing particle texture
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 0.6,
            vertexColors: true,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Shape Generators
        const shapes = {
            orb: () => {
                const radius = 12;
                for (let i = 0; i < particleCount; i++) {
                    const phi = Math.acos(-1 + (2 * i) / particleCount);
                    const theta = Math.sqrt(particleCount * Math.PI) * phi;
                    
                    targetPositions[i * 3]     = radius * Math.cos(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 2] = radius * Math.cos(phi);
                }
            },
            saturn: () => {
                const sphereCount = Math.floor(particleCount * 0.4);
                const ringCount = particleCount - sphereCount;
                
                // Core sphere
                for (let i = 0; i < sphereCount; i++) {
                    const radius = 7;
                    const phi = Math.acos(-1 + (2 * i) / sphereCount);
                    const theta = Math.sqrt(sphereCount * Math.PI) * phi;
                    
                    targetPositions[i * 3]     = radius * Math.cos(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 2] = radius * Math.cos(phi);
                }
                
                // Rings
                for (let i = sphereCount; i < particleCount; i++) {
                    const u = Math.random();
                    const radius = 11 + u * 13;
                    const theta = Math.random() * Math.PI * 2;
                    
                    targetPositions[i * 3]     = radius * Math.cos(theta);
                    targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
                    targetPositions[i * 3 + 2] = radius * Math.sin(theta);
                }
            },
            dna: () => {
                for (let i = 0; i < particleCount; i++) {
                    const t = (i / particleCount) * Math.PI * 12;
                    const strand = i % 2 === 0 ? 1 : -1;
                    const radius = 6;
                    
                    // If it's not part of the double helix structure, scatter as background dust
                    if (i < particleCount * 0.8) {
                        targetPositions[i * 3]     = Math.cos(t) * radius * strand;
                        targetPositions[i * 3 + 1] = (i / (particleCount * 0.8)) * 30 - 15;
                        targetPositions[i * 3 + 2] = Math.sin(t) * radius * strand;
                    } else {
                        // Connecting rungs
                        const progress = Math.random();
                        const tRung = (Math.floor(i / 10) / (particleCount * 0.8)) * Math.PI * 12;
                        targetPositions[i * 3]     = Math.cos(tRung) * radius * (progress - 0.5) * 2;
                        targetPositions[i * 3 + 1] = (tRung / (Math.PI * 12)) * 30 - 15;
                        targetPositions[i * 3 + 2] = Math.sin(tRung) * radius * (progress - 0.5) * 2;
                    }
                }
            },
            galaxy: () => {
                const arms = 3;
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2 * arms;
                    const radius = Math.pow(Math.random(), 2) * 20;
                    const spin = radius * 0.5;
                    
                    targetPositions[i * 3]     = Math.cos(angle + spin) * radius;
                    targetPositions[i * 3 + 1] = (Math.random() - 0.5) * (20 / (radius + 1));
                    targetPositions[i * 3 + 2] = Math.sin(angle + spin) * radius;
                }
            }
        };

        // Update colors based on current palette
        function updateColors() {
            const palette = palettes[currentPaletteIndex];
            const posAttr = geometry.attributes.position;
            
            for (let i = 0; i < particleCount; i++) {
                // Mix color based on position (e.g., height or distance)
                const mixedColor = palette.c1.clone();
                const lerpFactor = (targetPositions[i * 3 + 1] + 15) / 30; // normalized height roughly
                mixedColor.lerp(palette.c2, Math.max(0, Math.min(1, lerpFactor)));

                colors[i * 3]     = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        // Morph transition state using TWEEN
        let morphObj = { progress: 1 };
        function morphShape(shapeKey) {
            // Store current positions as start
            const posAttr = geometry.attributes.position;
            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = posAttr.array[i];
            }

            // Calculate new target positions
            shapes[shapeKey]();
            updateColors();

            morphObj.progress = 0;
            new TWEEN.Tween(morphObj)
                .to({ progress: 1 }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    const p = morphObj.progress;
                    const arr = posAttr.array;
                    for (let i = 0; i < particleCount * 3; i++) {
                        arr[i] = positions[i] + (targetPositions[i] - positions[i]) * p;
                    }
                    posAttr.needsUpdate = true;
                })
                .start();
        }

        // Initialize default shape & colors
        shapes.orb();
        updateColors();

        // UI Event Listeners
        const buttons = document.querySelectorAll('.ui-container .btn[data-mode]');
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                morphShape(e.target.dataset.mode);
            });
        });

        document.getElementById('colorBtn').addEventListener('click', () => {
            currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            updateColors();
        });

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mouse interaction wave effect variables
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();

            const elapsedTime = clock.getElapsedTime();

            // Subtle floating wave rotation on the particle system
            particleSystem.rotation.y = elapsedTime * 0.05 + mouseX;
            particleSystem.rotation.x = mouseY;

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
