<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definite Spinner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .spinner-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            border: 1px solid #334155;
            position: relative;
        }

        /* SVG Spinner Container */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            user-select: none;
        }

        /* The static pointer with physics tick hook */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #f43f5e;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transform-origin: top center;
            transition: transform 0.08s ease-out;
        }

        .pointer.tick {
            transform: translateX(-50%) rotate(22deg) scale(1.12);
        }

        svg {
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        .slice {
            cursor: pointer;
            transition: filter 0.2s;
        }

        .slice:hover {
            filter: brightness(1.15);
        }

        .slice-text {
            fill: #ffffff;
            font-weight: 700;
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #spin-btn {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        #spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        #spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #edit-btn {
            background: #334155;
            color: #f8fafc;
        }

        #edit-btn:hover {
            background: #475569;
        }

        /* Result Display */
        .result-display {
            min-height: 40px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #38bdf8;
            transition: all 0.3s;
        }

        /* Editor Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            color: #f8fafc;
        }

        #options-input {
            width: 100%;
            height: 150px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        #options-input:focus {
            border-color: #38bdf8;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }

        #save-btn {
            background: #10b981;
            color: white;
        }
        #save-btn:hover { background: #059669; }

        #cancel-btn {
            background: #334155;
            color: white;
        }
        #cancel-btn:hover { background: #475569; }

        /* Custom Context Menu */
        .context-menu {
            position: fixed;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 200px;
        }

        .context-menu.active {
            display: flex;
        }

        .context-menu-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            padding: 6px 12px;
            border-bottom: 1px solid #334155;
            margin-bottom: 4px;
        }

        .context-menu-item {
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 8px 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .context-menu-item:hover {
            background: #334155;
            color: #38bdf8;
        }

        .context-menu-item.selected::after {
            content: '✓';
            color: #38bdf8;
            font-weight: bold;
        }

        .context-divider {
            height: 1px;
            background: #334155;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Definite Spinner</h1>
            <p>Make your choice absolute. Spin the wheel to decide.</p>
        </header>

        <div class="spinner-card">
            <div class="result-display" id="result">Ready to spin!</div>

            <div class="wheel-container" id="wheel-container">
                <div class="pointer" id="pointer"></div>
                <svg id="wheel" viewBox="-160 -160 320 320">
                    <!-- Dynamic Wheel Paths -->
                </svg>
            </div>

            <div class="controls">
                <button id="edit-btn">Edit Options</button>
                <button id="spin-btn">SPIN</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Edit Wheel Options</h2>
            <p style="font-size: 0.85rem;">Enter one option per line:</p>
            <textarea id="options-input"></textarea>
            <div class="modal-buttons">
                <button id="cancel-btn">Cancel</button>
                <button id="save-btn">Save & Reset</button>
            </div>
        </div>
    </div>

    <!-- Right-click Context Menu -->
    <div class="context-menu" id="context-menu">
        <div class="context-menu-header">Force Landing Outcome</div>
        <div id="context-menu-items"></div>
        <div class="context-divider"></div>
        <button class="context-menu-item" id="infinite-toggle">Infinite Spinning</button>
    </div>

    <script>
        let options = ["Yes", "No", "Maybe", "Ask Again", "Definitely", "Absolutely Not"];
        let forcedTarget = "Ask Again";
        let infiniteSpinning = false;
        let sliceAnglesCache = [];

        const colors = [
            "#f43f5e", "#fb923c", "#fbbf24", "#34d399", 
            "#38bdf8", "#818cf8", "#e879f9", "#f472b6"
        ];

        let currentRotation = 0;
        let isSpinning = false;
        let animationFrameId = null;

        const wheel = document.getElementById('wheel');
        const wheelContainer = document.getElementById('wheel-container');
        const pointer = document.getElementById('pointer');
        const spinBtn = document.getElementById('spin-btn');
        const editBtn = document.getElementById('edit-btn');
        const resultDisplay = document.getElementById('result');
        const modal = document.getElementById('modal');
        const optionsInput = document.getElementById('options-input');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const contextMenu = document.getElementById('context-menu');
        const contextMenuItems = document.getElementById('context-menu-items');
        const infiniteToggle = document.getElementById('infinite-toggle');

        function createWheel() {
            wheel.innerHTML = '';
            sliceAnglesCache = [];
            const total = options.length;
            const angleStep = 360 / total;

            let currentAngleAcc = 0;
            options.forEach((option, index) => {
                const startAngle = currentAngleAcc;
                const endAngle = currentAngleAcc + angleStep;
                
                sliceAnglesCache.push({
                    index,
                    option,
                    start: startAngle,
                    end: endAngle,
                    center: startAngle + (angleStep / 2)
                });

                const x1 = 150 * Math.cos(Math.PI * startAngle / 180);
                const y1 = 150 * Math.sin(Math.PI * startAngle / 180);
                const x2 = 150 * Math.cos(Math.PI * endAngle / 180);
                const y2 = 150 * Math.sin(Math.PI * endAngle / 180);

                const largeArc = angleStep > 180 ? 1 : 0;
                const pathData = `M 0 0 L ${x1} ${y1} A 150 150 0 ${largeArc} 1 ${x2} ${y2} Z`;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('slice');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', colors[index % colors.length]);

                const textAngle = startAngle + angleStep / 2;
                const textRadius = 95;
                const tx = textRadius * Math.cos(Math.PI * textAngle / 180);
                const ty = textRadius * Math.sin(Math.PI * textAngle / 180);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', tx);
                text.setAttribute('y', ty);
                text.classList.add('slice-text');

                let rot = textAngle;
                if (textAngle > 90 && textAngle < 270) {
                    rot += 180;
                }
                text.setAttribute('transform', `rotate(${rot}, ${tx}, ${ty})`);

                text.textContent = option.length > 12 ? option.substring(0, 10) + '...' : option;

                g.appendChild(path);
                g.appendChild(text);
                wheel.appendChild(g);

                currentAngleAcc = endAngle;
            });

            if (!options.includes(forcedTarget)) {
                forcedTarget = options[0];
            }
        }

        wheelContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (isSpinning) return;

            contextMenuItems.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'context-menu-item';
                if (opt === forcedTarget && !infiniteSpinning) {
                    btn.classList.add('selected');
                }
                btn.textContent = opt;
                btn.onclick = () => {
                    forcedTarget = opt;
                    infiniteSpinning = false;
                    contextMenu.classList.remove('active');
                };
                contextMenuItems.appendChild(btn);
            });

            if (infiniteSpinning) {
                infiniteToggle.classList.add('selected');
            } else {
                infiniteToggle.classList.remove('selected');
            }

            const x = Math.min(e.clientX, window.innerWidth - 220);
            const y = Math.min(e.clientY, window.innerHeight - 300);
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.classList.add('active');
        });

        infiniteToggle.onclick = () => {
            infiniteSpinning = !infiniteSpinning;
            contextMenu.classList.remove('active');
        };

        window.addEventListener('click', () => {
            contextMenu.classList.remove('active');
        });

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultDisplay.textContent = "Spinning...";
            resultDisplay.style.color = "#94a3b8";

            let targetSlice = sliceAnglesCache.find(s => s.option === forcedTarget);
            if (!targetSlice) targetSlice = sliceAnglesCache[0];

            let lastCheckedAngle = -1;
            const startRotationAngle = parseFloat(wheel.style.transform.replace(/[^0-9.-]/g, '')) || 0;

            if (infiniteSpinning) {
                // Infinite Mode: Gradually decelerates into a continuous low-speed crawl forever
                const extraSpins = 6;
                const sliceWidth = targetSlice.end - targetSlice.start;
                const safeMargin = sliceWidth * 0.3;
                const randomOffsetWithinSlice = (Math.random() * (sliceWidth - (safeMargin * 2))) + safeMargin;
                const absoluteTargetSliceCoord = targetSlice.start + randomOffsetWithinSlice;

                const currentMod = startRotationAngle % 360;
                const targetMod = (270 - absoluteTargetSliceCoord + 360) % 360;
                let diff = targetMod - currentMod;
                if (diff <= 0) diff += 360;

                const totalTransitionDelta = (extraSpins * 360) + diff;
                const decelerationDurationMs = 5000;
                const startTime = performance.now();

                function cubicBezier(p1x, p1y, p2x, p2y, t) {
                    const cx = 3 * p1x;
                    const bx = 3 * (p2x - p1x) - cx;
                    const ax = 1 - cx - bx;
                    const cy = 3 * p1y;
                    const by = 3 * (p2y - p1y) - cy;
                    const ay = 1 - cy - by;
                    return ((ay * t + by) * t + cy) * t;
                }

                function animateInfinite(currentTime) {
                    const elapsed = currentTime - startTime;
                    let currentAnimatedRotation;

                    if (elapsed < decelerationDurationMs) {
                        const progress = elapsed / decelerationDurationMs;
                        // Organic deceleration curve ending right on the target coordinate
                        const easedProgress = cubicBezier(0.08, 0.16, 0.05, 0.99, progress);
                        currentAnimatedRotation = startRotationAngle + (totalTransitionDelta * easedProgress);
                    } else {
                        // After deceleration completes, continue at a smooth perpetual crawl speed forever
                        const crawlElapsed = elapsed - decelerationDurationMs;
                        currentAnimatedRotation = startRotationAngle + totalTransitionDelta + (crawlElapsed * 0.035);
                    }

                    wheel.style.transform = `rotate(${currentAnimatedRotation}deg)`;

                    const normalizedDeg = currentAnimatedRotation % 360;
                    if (Math.abs(normalizedDeg - lastCheckedAngle) > 10) {
                        lastCheckedAngle = normalizedDeg;
                        pointer.classList.add('tick');
                        setTimeout(() => pointer.classList.remove('tick'), 70);
                    }

                    animationFrameId = requestAnimationFrame(animateInfinite);
                }

                animationFrameId = requestAnimationFrame(animateInfinite);

            } else {
                // Standard Definite Spin
                const extraSpins = Math.floor(Math.random() * 8) + 6;
                const spinDuration = 4.0 + Math.random() * 2.5;
                
                const b1 = (Math.random() * 0.05).toFixed(2);
                const b2 = (Math.random() * 0.15).toFixed(2);
                const b3 = (Math.random() * 0.05 + 0.9).toFixed(2);
                const b4 = (Math.random() * 0.05 + 0.98).toFixed(2);

                const sliceWidth = targetSlice.end - targetSlice.start;
                const safeMargin = sliceWidth * 0.3;
                const randomOffsetWithinSlice = (Math.random() * (sliceWidth - (safeMargin * 2))) + safeMargin;
                const absoluteTargetSliceCoord = targetSlice.start + randomOffsetWithinSlice;

                const currentMod = currentRotation % 360;
                const targetMod = (270 - absoluteTargetSliceCoord + 360) % 360;
                
                let diff = targetMod - currentMod;
                if (diff <= 0) diff += 360;

                const totalRotation = currentRotation + (extraSpins * 360) + diff;
                currentRotation = totalRotation;

                const startTime = performance.now();
                const durationMs = spinDuration * 1000;
                const totalDeltaAngle = totalRotation - startRotationAngle;

                function cubicBezier(p1x, p1y, p2x, p2y, t) {
                    const cx = 3 * p1x;
                    const bx = 3 * (p2x - p1x) - cx;
                    const ax = 1 - cx - bx;
                    const cy = 3 * p1y;
                    const by = 3 * (p2y - p1y) - cy;
                    const ay = 1 - cy - by;
                    return ((ay * t + by) * t + cy) * t;
                }

                function animateSpin(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / durationMs, 1);

                    const easedProgress = cubicBezier(parseFloat(b1), parseFloat(b2), parseFloat(b3), parseFloat(b4), progress);
                    const currentAnimatedRotation = startRotationAngle + (totalDeltaAngle * easedProgress);

                    wheel.style.transform = `rotate(${currentAnimatedRotation}deg)`;

                    const normalizedDeg = currentAnimatedRotation % 360;
                    if (Math.abs(normalizedDeg - lastCheckedAngle) > 10) {
                        lastCheckedAngle = normalizedDeg;
                        pointer.classList.add('tick');
                        setTimeout(() => pointer.classList.remove('tick'), 70);
                    }

                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(animateSpin);
                    } else {
                        isSpinning = false;
                        spinBtn.disabled = false;
                        
                        resultDisplay.textContent = `🎯 ${targetSlice.option}`;
                        resultDisplay.style.color = "#38bdf8";
                    }
                }

                animationFrameId = requestAnimationFrame(animateSpin);
            }
        }

        spinBtn.addEventListener('click', () => {
            if (infiniteSpinning && isSpinning) {
                cancelAnimationFrame(animationFrameId);
                isSpinning = false;
                infiniteSpinning = false;
                spinBtn.disabled = false;
                resultDisplay.textContent = `🎯 ${forcedTarget}`;
                resultDisplay.style.color = "#38bdf8";
                return;
            }
            spinWheel();
        });

        editBtn.addEventListener('click', () => {
            optionsInput.value = options.join('\n');
            modal.classList.add('active');
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        saveBtn.addEventListener('click', () => {
            const newOptions = optionsInput.value
                .split('\n')
                .map(opt => opt.trim())
                .filter(opt => opt.length > 0);

            if (newOptions.length < 2) {
                alert('Please enter at least 2 options.');
                return;
            }

            options = newOptions;
            currentRotation = 0;
            infiniteSpinning = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            isSpinning = false;
            spinBtn.disabled = false;
            wheel.style.transform = 'rotate(0deg)';
            
            createWheel();
            modal.classList.remove('active');
            resultDisplay.textContent = "Ready to spin!";
            resultDisplay.style.color = "#38bdf8";
        });

        createWheel();
    </script>
</body>
</html>
